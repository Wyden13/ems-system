name: EMS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend unit and PostgreSQL tests
        working-directory: ems-services
        run: ./ems-auth-service/mvnw -B -f pom.xml -Pintegration verify
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
          npx playwright install --with-deps chromium
      - name: Integrated browser workflows
        working-directory: ems-services
        run: ./scripts/test-stack.sh
      - name: Verify database restoration
        working-directory: ems-services
        run: |
          ./scripts/backup-databases.sh "$RUNNER_TEMP/ems-backup" compose.test.yml
          ./scripts/verify-backup.sh "$RUNNER_TEMP/ems-backup"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            frontend/test-results/
            ems-services/**/target/surefire-reports/
            ems-services/**/target/failsafe-reports/
      - name: Stop isolated test stack
        if: always()
        working-directory: ems-services
        run: docker compose -f compose.test.yml down
