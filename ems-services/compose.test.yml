      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_payroll_db
      SPRING_DATASOURCE_USERNAME: payroll_user
      SPRING_DATASOURCE_PASSWORD: integration-test-only
    volumes:
