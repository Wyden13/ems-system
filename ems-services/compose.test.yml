name: ems-integration-test
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: integration-test-only
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: integration-test-only
      EMPLOYEE_DB_PASSWORD: integration-test-only
      ORGANIZATION_DB_PASSWORD: integration-test-only
      SCHEDULE_DB_PASSWORD: integration-test-only
      ATTENDANCE_DB_PASSWORD: integration-test-only
      PAYROLL_DB_PASSWORD: integration-test-only
      LEAVE_DB_PASSWORD: integration-test-only
    volumes:
      - integration-test-data:/var/lib/postgresql
      - ./docker/postgres-server/init-databases.sh:/opt/ems/init-databases.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth-service:
    image: ems/auth-service:local
    environment:
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:15173
      DB_URL: jdbc:postgresql://postgres:5432/ems_auth_db
      DB_USERNAME: auth_user
      DB_PASSWORD: integration-test-only
      TLS_CERT: file:/certs/auth-service.crt
      TLS_KEY: file:/certs/auth-service.key
      TLS_CA: file:/certs/ca.crt
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/auth-service.crt:/certs/auth-service.crt:ro
      - ./.local/certs/auth-service.key:/certs/auth-service.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 50
      start_period: 20s
  employee-service:
    image: ems/employee-service:local
    environment:
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:15173
      DB_URL: jdbc:postgresql://postgres:5432/ems_employee_db
      DB_USERNAME: employee_user
      DB_PASSWORD: integration-test-only
      TLS_CERT: file:/certs/employee-service.crt
      TLS_KEY: file:/certs/employee-service.key
      TLS_CA: file:/certs/ca.crt
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/employee-service.crt:/certs/employee-service.crt:ro
      - ./.local/certs/employee-service.key:/certs/employee-service.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 50
      start_period: 20s
  organization-service:
    image: ems/organization-service:local
    environment:
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:15173
      DB_URL: jdbc:postgresql://postgres:5432/ems_organization_db
      DB_USERNAME: organization_user
      DB_PASSWORD: integration-test-only
      TLS_CERT: file:/certs/organization-service.crt
      TLS_KEY: file:/certs/organization-service.key
      TLS_CA: file:/certs/ca.crt
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/organization-service.crt:/certs/organization-service.crt:ro
      - ./.local/certs/organization-service.key:/certs/organization-service.key:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:18087:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 3s
      timeout: 3s
      retries: 50
      start_period: 20s
  attendance-service:
    image: ems/attendance-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:15173
      TLS_CERT: file:/certs/attendance-service.crt
      TLS_KEY: file:/certs/attendance-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_attendance_db
      SPRING_DATASOURCE_USERNAME: attendance_user
      SPRING_DATASOURCE_PASSWORD: integration-test-only
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/attendance-service.crt:/certs/attendance-service.crt:ro
      - ./.local/certs/attendance-service.key:/certs/attendance-service.key:ro
    ports:
      - "127.0.0.1:18084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  payroll-service:
