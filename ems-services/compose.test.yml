    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SECURE_COOKIE: "false"
