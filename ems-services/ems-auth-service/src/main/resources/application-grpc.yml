spring:
  # Internal lookups use mutual TLS plus ServiceIdentityInterceptor, not end-user JWTs.
  autoconfigure:
    exclude: org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  grpc:
    server:
      port: 9090
      reflection:
        enabled: false
      ssl:
        bundle: service
        client-auth: require
  ssl:
    bundle:
      pem:
        service:
          keystore:
            certificate: ${TLS_CERT}
            private-key: ${TLS_KEY}
          truststore:
            certificate: ${TLS_CA}
