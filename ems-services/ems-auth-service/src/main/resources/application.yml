server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  profiles:
    include: grpc
  application:
    name: ems-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ems_auth_db}
    username: ${DB_USERauth:auth_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ems-auth-service
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
app:
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  session:
    secure-cookie: ${SECURE_COOKIE:true}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
