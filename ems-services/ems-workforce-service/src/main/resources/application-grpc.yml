spring:
  autoconfigure:
    exclude: org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  grpc:
    server:
      enabled: false
    client:
      channel:
        people:
          target: ${PEOPLE_GRPC_TARGET:people-service:9090}
          ssl:
            bundle: service
  ssl:
    bundle:
      pem:
        service:
          keystore:
            certificate: ${TLS_CERT}
            private-key: ${TLS_KEY}
          truststore:
            certificate: ${TLS_CA}
