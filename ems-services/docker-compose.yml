name: ems-platform
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in
        .env}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD:?Run scripts/setup-local.sh}
      WORKFORCE_DB_PASSWORD: ${WORKFORCE_DB_PASSWORD:?Run scripts/setup-local.sh}
    ports:
    - 127.0.0.1:5432:5432
    volumes:
    - consolidated-postgres-data:/var/lib/postgresql
    - ./docker/postgres-server/init-databases.sh:/opt/ems/init-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-auth-service
    image: ems/auth-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: '8080'
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: 'false'
      TLS_CERT: file:/certs/auth-service.crt
      TLS_KEY: file:/certs/auth-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    volumes:
    - ./.local/certs/ca.crt:/certs/ca.crt:ro
    - ./.local/certs/auth-service.crt:/certs/auth-service.crt:ro
    - ./.local/certs/auth-service.key:/certs/auth-service.key:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    ports:
    - 127.0.0.1:8081:8080
    depends_on:
      postgres:
        condition: service_healthy
  people-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-people-service
    image: ems/people-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: '8080'
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: 'false'
      TLS_CERT: file:/certs/people-service.crt
      TLS_KEY: file:/certs/people-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_people_db
      SPRING_DATASOURCE_USERNAME: people_user
      SPRING_DATASOURCE_PASSWORD: ${PEOPLE_DB_PASSWORD:?Run scripts/setup-local.sh}
      ALLOWED_ORIGINS: http://localhost:5173
    volumes:
    - ./.local/certs/ca.crt:/certs/ca.crt:ro
    - ./.local/certs/people-service.crt:/certs/people-service.crt:ro
    - ./.local/certs/people-service.key:/certs/people-service.key:ro
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    ports:
    - 127.0.0.1:8082:8080
    depends_on:
      postgres:
        condition: service_healthy
  workforce-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-workforce-service
    image: ems/workforce-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: '8080'
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: 'false'
      ALLOWED_ORIGINS: http://localhost:5173
      TLS_CERT: file:/certs/workforce-service.crt
      TLS_KEY: file:/certs/workforce-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_workforce_db
      SPRING_DATASOURCE_USERNAME: workforce_user
      SPRING_DATASOURCE_PASSWORD: ${WORKFORCE_DB_PASSWORD:?Run scripts/setup-local.sh}
    volumes:
    - ./.local/certs/ca.crt:/certs/ca.crt:ro
    - ./.local/certs/workforce-service.crt:/certs/workforce-service.crt:ro
    - ./.local/certs/workforce-service.key:/certs/workforce-service.key:ro
    ports:
    - 127.0.0.1:8083:8080
    depends_on:
      postgres:
        condition: service_healthy
      people-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health/readiness
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
  gateway-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-gateway-service
    image: ems/gateway-service:local
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      AUTH_URL: http://auth-service:8080
      PEOPLE_URL: http://people-service:8080
      WORKFORCE_URL: http://workforce-service:8080
    ports:
    - 127.0.0.1:8080:8080
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost:8080/actuator/health
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      auth-service:
        condition: service_healthy
      people-service:
        condition: service_healthy
      workforce-service:
        condition: service_healthy
volumes:
  consolidated-postgres-data: null
