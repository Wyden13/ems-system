name: ems-platform

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD:?Set EMPLOYEE_DB_PASSWORD in .env}
      SCHEDULE_DB_PASSWORD: ${SCHEDULE_DB_PASSWORD:?Set SCHEDULE_DB_PASSWORD in .env}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?Set ATTENDANCE_DB_PASSWORD in .env}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:?Set PAYROLL_DB_PASSWORD in .env}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD:?Set LEAVE_DB_PASSWORD in .env}
      ORGANIZATION_DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD:?Set ORGANIZATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-server/init-databases.sh:/opt/ems/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  auth-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-auth-service
    image: ems/auth-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: "false"
      TLS_CERT: file:/certs/auth-service.crt
      TLS_KEY: file:/certs/auth-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/auth-service.crt:/certs/auth-service.crt:ro
      - ./.local/certs/auth-service.key:/certs/auth-service.key:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  employee-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-employee-service
    image: ems/employee-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: "false"
      TLS_CERT: file:/certs/employee-service.crt
      TLS_KEY: file:/certs/employee-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_employee_db
      SPRING_DATASOURCE_USERNAME: employee_user
      SPRING_DATASOURCE_PASSWORD: ${EMPLOYEE_DB_PASSWORD:?Set EMPLOYEE_DB_PASSWORD in .env}
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/employee-service.crt:/certs/employee-service.crt:ro
      - ./.local/certs/employee-service.key:/certs/employee-service.key:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  scheduling-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-scheduling-service
    image: ems/scheduling-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:5173
      TLS_CERT: file:/certs/scheduling-service.crt
      TLS_KEY: file:/certs/scheduling-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_schedule_db
      SPRING_DATASOURCE_USERNAME: schedule_user
      SPRING_DATASOURCE_PASSWORD: ${SCHEDULE_DB_PASSWORD:?Set database password in .env}
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/scheduling-service.crt:/certs/scheduling-service.crt:ro
      - ./.local/certs/scheduling-service.key:/certs/scheduling-service.key:ro
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  attendance-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-attendance-service
    image: ems/attendance-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:5173
      TLS_CERT: file:/certs/attendance-service.crt
      TLS_KEY: file:/certs/attendance-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_attendance_db
      SPRING_DATASOURCE_USERNAME: attendance_user
      SPRING_DATASOURCE_PASSWORD: ${ATTENDANCE_DB_PASSWORD:?Set database password in .env}
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/attendance-service.crt:/certs/attendance-service.crt:ro
      - ./.local/certs/attendance-service.key:/certs/attendance-service.key:ro
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  payroll-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-payroll-service
    image: ems/payroll-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:5173
      TLS_CERT: file:/certs/payroll-service.crt
      TLS_KEY: file:/certs/payroll-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_payroll_db
      SPRING_DATASOURCE_USERNAME: payroll_user
      SPRING_DATASOURCE_PASSWORD: ${PAYROLL_DB_PASSWORD:?Set database password in .env}
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/payroll-service.crt:/certs/payroll-service.crt:ro
      - ./.local/certs/payroll-service.key:/certs/payroll-service.key:ro
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  leave-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.integration
      args:
        SERVICE: ems-leave-service
    image: ems/leave-service:local
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: "false"
      ALLOWED_ORIGINS: http://localhost:5173
      TLS_CERT: file:/certs/leave-service.crt
      TLS_KEY: file:/certs/leave-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_leave_db
      SPRING_DATASOURCE_USERNAME: leave_user
      SPRING_DATASOURCE_PASSWORD: ${LEAVE_DB_PASSWORD:?Set database password in .env}
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/leave-service.crt:/certs/leave-service.crt:ro
      - ./.local/certs/leave-service.key:/certs/leave-service.key:ro
    ports:
      - "127.0.0.1:8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
      employee-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
