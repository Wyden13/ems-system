      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      SECURE_COOKIE: "false"
      TLS_CERT: file:/certs/organization-service.crt
      TLS_KEY: file:/certs/organization-service.key
      TLS_CA: file:/certs/ca.crt
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ems_organization_db
      SPRING_DATASOURCE_USERNAME: organization_user
      SPRING_DATASOURCE_PASSWORD: ${ORGANIZATION_DB_PASSWORD:?Set ORGANIZATION_DB_PASSWORD in .env}
    volumes:
      - ./.local/certs/ca.crt:/certs/ca.crt:ro
      - ./.local/certs/organization-service.crt:/certs/organization-service.crt:ro
      - ./.local/certs/organization-service.key:/certs/organization-service.key:ro
