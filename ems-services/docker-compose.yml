      JWT_SECRET: ${JWT_SECRET:?Run scripts/setup-local.sh}
      AUTH_URL: http://auth-service:8080
      EMPLOYEE_URL: http://employee-service:8080
      ORGANIZATION_URL: http://organization-service:8080
      ATTENDANCE_URL: http://attendance-service:8080
      PAYROLL_URL: http://payroll-service:8080
      SCHEDULING_URL: http://scheduling-service:8080
      LEAVE_URL: http://leave-service:8080
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      auth-service:
        condition: service_healthy
      employee-service:
        condition: service_healthy
      organization-service:
        condition: service_healthy
      attendance-service:
        condition: service_healthy
      payroll-service:
        condition: service_healthy
      scheduling-service:
        condition: service_healthy
      leave-service:
        condition: service_healthy

volumes:
  postgres-data:
