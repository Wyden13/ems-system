spring:
  autoconfigure:
    exclude: org.springframework.boot.grpc.server.autoconfigure.security.GrpcServerOAuth2ResourceServerAutoConfiguration
  grpc:
    client:
      channel:
        employee:
          target: ${EMPLOYEE_GRPC_TARGET:employee-service:9090}
          ssl:
            bundle: service
        attendance:
          target: ${ATTENDANCE_GRPC_TARGET:attendance-service:9090}
          ssl:
            bundle: service
  ssl:
    bundle:
      pem:
        service:
          keystore:
            certificate: ${TLS_CERT}
            private-key: ${TLS_KEY}
          truststore:
            certificate: ${TLS_CA}
